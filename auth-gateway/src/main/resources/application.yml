server:
  # The delete-uin page (charts/local-dev/values-local.json) calls the delete
  # API on 8095, so the gateway owns this port. The deletion service sits behind
  # it on 8096.
  port: 8095

spring:
  application:
    name: auth-gateway

app:
  # Where the delete-uin static page is served from, for CORS.
  allowed-origins:
    - "http://localhost:5501"
    - "http://127.0.0.1:5501"

  esignet:
    token-url: "http://localhost:8088/v1/esignet/oauth/v2/token"
    userinfo-url: "http://localhost:8088/v1/esignet/oidc/userinfo"
    client-id: "mosip-collab-delete-uin-client"
    # RP private key whose public half is registered for the client above.
    rp-private-key: "classpath:esignet-rp-private-key.pem"

  # 5-minute JWT the gateway mints and hands to the deletion service.
  gateway-jwt:
    private-key: "classpath:gateway-signing-private.pem"
    issuer: "mosip-collab-auth-gateway"
    audience: "identity-data-deletion-service"
    ttl-seconds: 300

  deletion-service:
    execute-url: "http://localhost:8096/api/deletion/execute"

  # eSignet returns only a pairwise pseudonym (sub); the mock identity system
  # does not emit the individual_id claim. The mock's kyc_auth table maps that
  # pseudonym back to the real UIN, so the gateway looks it up there. In a real
  # deployment the IDA plugin returns individual_id in userinfo and this is unused.
  mock-identity:
    url: "jdbc:postgresql://localhost:5455/mosip_mockidentitysystem"
    username: postgres
    password: postgres
