worker_processes  1;

events {
  worker_connections  1024;
}

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  server {
    listen 3000;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location /v1/esignet {
      proxy_pass         http://esignet:8088/v1/esignet;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
    }
    location /.well-known/openid-configuration {
      proxy_pass         http://esignet:8088/v1/esignet/oidc/.well-known/openid-configuration;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
    }
    location /.well-known/jwks.json {
      proxy_pass         http://esignet:8088/v1/esignet/oauth/.well-known/jwks.json;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
    }
    location /.well-known/oauth-authorization-server {
      proxy_pass         http://esignet:8088/v1/esignet/oauth/.well-known/oauth-authorization-server;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
    }
    location /.well-known/openid-credential-issuer {
      proxy_pass         http://esignet:8088/v1/esignet/vci/.well-known/openid-credential-issuer;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
    }
    # location /oidc-ui {
    #   alias /usr/share/nginx/oidc-ui;
    #   try_files $uri $uri/ /oidc-ui/index.html;
    # }
    location / {
      # alias /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    # Every page of the UI (/authorize, /consent, /something-went-wrong ...) is
    # served from this one file, so this block runs on each full page load.
    #
    # The UI caches its CSRF token in sessionStorage['csrfToken'] and never
    # refreshes it (oidc-ui/src/services/api.service.js). A browser tab that
    # outlives an eSignet restart keeps sending a token that no longer matches
    # its XSRF-TOKEN cookie, and every POST fails with 403, which the UI shows as
    # "Forbidden" at /something-went-wrong. Clearing the cached token before the
    # app starts makes each page load fetch a fresh, matching token. Doing it
    # here, in the mounted config, survives image pulls and container recreates.
    location = /index.html {
      sub_filter '<head>' '<head><script>try{sessionStorage.removeItem("csrfToken")}catch(e){}</script>';
      sub_filter_once on;
      add_header Cache-Control "no-store" always;
    }
  }
}