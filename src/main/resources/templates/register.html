<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Portal - Register</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="app-header">
    <div class="header-container">
        <a href="/" class="brand-section">
            <div class="brand-logo"><img th:src="@{/images/identity-registration-icon.png}" alt="Identity Portal"></div>
            <div><span class="brand-name">Identity Portal</span><span class="brand-tagline">Mock eSignet Registration</span></div>
        </a>
        <nav><ul class="nav-links"><li><a href="/" class="nav-link">Home</a></li><li><a href="/register" class="nav-link active">Register</a></li><li><a href="/audit-logs" class="nav-link">Audit Logs</a></li></ul></nav>
    </div>
</header>

<main class="main-content">
    <div class="form-container">
        <div class="form-header">
            <h2 class="form-header-title">Identity Registration</h2>
            <p class="form-header-subtitle">Details are stored only in the local mock identity service.</p>
        </div>
        <div th:if="${errorMessage}" class="consent-box" style="border-color:#dc2626;color:#991b1b;margin:1rem;">
            <i class="fa-solid fa-circle-exclamation"></i>&nbsp;<span th:text="${errorMessage}">Registration failed.</span>
        </div>
        <form th:action="@{/register}" th:object="${registration}" method="POST" enctype="multipart/form-data">
            <div class="form-body">
                <div class="form-group">
                    <label for="individualId" class="form-label">Individual ID (UIN)</label>
                    <input type="text" id="individualId" th:field="*{individualId}" class="form-input" pattern="[0-9]{5,19}" placeholder="5 to 19 digits" required>
                </div>
                <div class="form-group-grid">
                    <div class="form-group"><label for="givenName" class="form-label">Given Name</label><input type="text" id="givenName" th:field="*{givenName}" class="form-input" required></div>
                    <div class="form-group"><label for="familyName" class="form-label">Family Name</label><input type="text" id="familyName" th:field="*{familyName}" class="form-input" required></div>
                </div>
                <div class="form-group-grid">
                    <div class="form-group"><label for="gender" class="form-label">Gender</label><select id="gender" th:field="*{gender}" class="form-input" required><option value="">Select</option><option value="Female">Female</option><option value="Male">Male</option><option value="Other">Other</option></select></div>
                    <div class="form-group"><label for="preferredLang" class="form-label">Preferred Language</label><select id="preferredLang" th:field="*{preferredLang}" class="form-input" required><option value="en">English</option></select></div>
                </div>
                <div class="form-group-grid">
                    <div class="form-group"><label for="phone" class="form-label">Phone Number</label><input type="tel" id="phone" th:field="*{phone}" class="form-input" placeholder="e.g. +919876543210" required></div>
                    <div class="form-group"><label for="email" class="form-label">Email Address</label><input type="email" id="email" th:field="*{email}" class="form-input" required></div>
                </div>
                <div class="form-group-grid">
                    <div class="form-group"><label for="dob" class="form-label">Date of Birth</label><input type="date" id="dob" th:field="*{dob}" class="form-input" required></div>
                    <div class="form-group"><label for="pin" class="form-label">PIN</label><input type="password" id="pin" th:field="*{pin}" class="form-input" autocomplete="new-password" required></div>
                </div>
                <div class="form-group-grid">
                    <div class="form-group"><label for="locality" class="form-label">Locality</label><input type="text" id="locality" th:field="*{locality}" class="form-input" required></div>
                    <div class="form-group"><label for="region" class="form-label">Region / State</label><input type="text" id="region" th:field="*{region}" class="form-input" required></div>
                </div>
                <div class="form-group-grid">
                    <div class="form-group"><label for="country" class="form-label">Country</label><input type="text" id="country" th:field="*{country}" class="form-input" required></div>
                    <div class="form-group"><label for="postalCode" class="form-label">Postal Code</label><input type="text" id="postalCode" th:field="*{postalCode}" class="form-input" required></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="profileImage"><i class="fa-solid fa-image" style="margin-right:6px;color:var(--primary);"></i>Profile Photo</label>
                    <div class="upload-container"><div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div><div class="upload-text"><span class="upload-text-bold">Click to upload</span> a profile photo</div><div class="upload-text" style="font-size:.75rem;margin-top:4px;color:var(--text-muted);">PNG, JPG, JPEG, WEBP up to 5MB</div><input type="file" id="profileImage" th:field="*{profileImage}" class="upload-input" accept="image/*" required></div>
                    <div class="preview-container" id="previewWrapper"><img src="#" alt="Profile photo preview" id="imagePreviewElement" class="image-preview"></div>
                </div>
                <div class="consent-box"><input type="checkbox" id="consent" th:field="*{consent}" class="consent-checkbox" required><label for="consent" class="consent-text">I consent to storing my registration data in the local mock identity service for testing purposes.</label></div>
            </div>
            <div class="form-actions"><a href="/" class="cta-button-secondary" style="margin-left:0;">Cancel</a><button type="submit" class="cta-button"><i class="fa-solid fa-paper-plane" style="margin-right:8px;"></i>Store in Mock Identity</button></div>
        </form>
    </div>
</main>
<footer class="app-footer"><p>&copy; 2026 Identity Portal</p></footer>
<script>
const input=document.getElementById('profileImage'),wrapper=document.getElementById('previewWrapper'),preview=document.getElementById('imagePreviewElement');
input.addEventListener('change',()=>{const file=input.files[0];if(!file){wrapper.style.display='none';return;}const reader=new FileReader();reader.onload=()=>{preview.src=reader.result;wrapper.style.display='flex';};reader.readAsDataURL(file);});
</script>
</body>
</html>
