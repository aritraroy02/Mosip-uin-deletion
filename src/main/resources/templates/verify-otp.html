<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - MOSIP Collab</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" th:href="@{/css/collab-theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--collab-bg); }
        .delete-page { max-width: 620px; }
        .delete-page .form-header { text-align: center; }
        .delete-icon { width: 52px; height: 52px; margin: 0 auto 1rem; border-radius: 50%; display: grid; place-items: center; background: var(--collab-tint-esignet); color: #ca7322; font-size: 1.4rem; }
        .delete-page .form-body { padding-bottom: 1rem; }
        .input-with-icon { position: relative; }
        .input-with-icon .form-input { padding-left: 2.75rem; }
        .input-with-icon i { position: absolute; top: 50%; left: 1rem; transform: translateY(-50%); color: var(--collab-text-faint); }
        .otp-note { display: flex; gap: .65rem; align-items: flex-start; margin: 1.25rem 0; padding: 1rem; border: 1px solid #bfdbfe; border-radius: 10px; background: #eff6ff; color: #1e3a8a; font-size: .875rem; }
        .otp-note code { padding: .1rem .35rem; border-radius: 4px; background: #dbeafe; font-weight: 700; }
        .verification-message { margin-bottom: 1.25rem; padding: 1rem; border-radius: 10px; font-size: .9rem; }
        .verification-message.error { border: 1px solid #fecaca; background: #fef2f2; color: #991b1b; }
        .verification-message.success { border: 1px solid var(--collab-success-border); background: var(--collab-success-bg); color: var(--collab-success-text); }
        .form-container { border-radius: var(--collab-radius-card) !important; box-shadow: var(--collab-shadow-card) !important; }
        .cta-button { background: #1763ac !important; border-radius: 9px !important; }
        @media (max-width: 580px) { .form-actions { flex-direction: column-reverse; padding: 1.25rem; } .form-actions a, .form-actions button { width: 100%; margin: 0 !important; } }
    </style>
</head>
<body>
    <header class="collab-simple-header">
        <a href="/" class="collab-nav-brand">
            <img th:src="@{/images/collab/mark-header.png}" alt="MOSIP">
            <span>MOSIP Collab</span>
        </a>
    </header>

    <main class="main-content">
        <section class="form-container delete-page" aria-labelledby="verify-title">
            <div class="form-header">
                <div class="delete-icon"><i class="fa-solid fa-key"></i></div>
                <h1 id="verify-title" class="form-header-title">Verify OTP</h1>
                <p class="form-header-subtitle">Enter the one-time password to check your UIN in the registry.</p>
            </div>

            <form th:action="@{/delete/verify-otp}" method="post">
                <div class="form-body">
                    <div th:if="${errorMessage}" class="verification-message error" role="status" aria-live="polite" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="verification-message success" role="status" aria-live="polite" th:text="${successMessage}"></div>

                    <input type="hidden" name="uin" th:value="${uin}">

                    <div class="form-group">
                        <label class="form-label" for="otp">One-time password (OTP) <span aria-hidden="true" style="color: var(--error);">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-key" aria-hidden="true"></i>
                            <input class="form-input" id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{5}" maxlength="5" placeholder="Enter 5-digit OTP" required>
                        </div>
                        <p class="form-header-subtitle">Sent to the contact registered against UIN <strong th:text="${uin}"></strong>.</p>
                    </div>

                    <div class="otp-note">
                        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                        <span>Demo-only: use OTP <code>00000</code>. OTP delivery is not connected to an SMS/email provider yet.</span>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/delete" class="cta-button-secondary">Back</a>
                    <button type="submit" class="cta-button" style="background: #dc2626;">
                        Verify OTP <i class="fa-solid fa-arrow-right" style="margin-left: .5rem;"></i>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="collab-footer">
        &copy; 2026 All Rights Reserved &middot; MOSIP
    </footer>
</body>
</html>
